services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/12345678
    volumes:
      - neo4j_data:/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_PASSWORD=12345678
      - CORS_ORIGINS=http://localhost:8080,http://localhost:5173
      # AI features reach Ollama running on the host machine
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo
      - neo4j

  verifyeye-agent:
    build: ./verifyeye-ingress
    ports:
      - "8100:8100"
    environment:
      # where the agent sends its evidence screenshots
      CORE_API_URL: http://backend:8000
    # lets the sandboxed agent reach the host (and host.docker.internal URLs)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  neo4j_data:
