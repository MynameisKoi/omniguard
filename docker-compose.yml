services: 
  mongo:
    image: mongo:7
    ports: 
      - "27017:27017"
    volumes: 
      - mongo_data:/data/db 

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/12345678
    volumes:
      - neo4j_data:/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_PASSWORD=12345678
      - CORS_ORIGINS=http://localhost:8080
    depends_on:
      - mongo
      - neo4j

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
      
volumes:
  mongo_data:
  neo4j_data: