version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: omniguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  neo4j:
    image: neo4j:5
    container_name: omniguard-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-omniguard_secret}
    volumes:
      - neo4j-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=omniguard
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-omniguard_secret}
    depends_on:
      - mongo
      - neo4j

  spectrac2:
    build:
      context: ./spectrac2-engine
      dockerfile: Dockerfile
    container_name: omniguard-spectrac2
    restart: unless-stopped
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omniguard-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo-data:
  neo4j-data:
